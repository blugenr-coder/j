#cloud-config
# Hands a fresh Debian machine everything it needs, at first boot.
# Pass it to Compute Engine with:
#   --metadata-from-file user-data=deploy/cloud-init.yaml
#
# When it finishes there is a running site — apart from the domain, which has
# to go in the Caddyfile once DNS points at the machine.

package_update: true
packages:
  - ca-certificates
  - curl
  - git

runcmd:
  - install -m 0755 -d /etc/apt/keyrings
  - curl -fsSL https://download.docker.com/linux/debian/gpg -o /etc/apt/keyrings/docker.asc
  - chmod a+r /etc/apt/keyrings/docker.asc
  - echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/debian $(. /etc/os-release && echo $VERSION_CODENAME) stable" > /etc/apt/sources.list.d/docker.list
  - apt-get update
  - apt-get install -y docker-ce docker-ce-cli containerd.io docker-buildx-plugin docker-compose-plugin
  - git clone --branch claude/worksheethub-website-plan-12xoey https://github.com/blugenr-coder/j.git /srv/worksheethub
  - docker compose -f /srv/worksheethub/deploy/docker-compose.yml up -d --build

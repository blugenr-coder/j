<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dashboard — WorksheetHub</title>
<meta name="description" content="Your progress, what to continue, and what to practise next.">
<!-- Behind a sign-in: a crawler gets an empty state, so there is nothing
     here to index. "follow" so the links out still carry weight. -->
<meta name="robots" content="noindex, follow">
<link rel="icon" type="image/svg+xml" href="assets/img/favicon.svg">
<link rel="alternate icon" sizes="64x64" href="assets/img/favicon-64.png">
<link rel="apple-touch-icon" href="assets/img/apple-touch-icon.png">
<meta name="theme-color" content="#4B3FD4">
<meta property="og:type" content="website">
<meta property="og:site_name" content="WorksheetHub">
<meta property="og:title" content="Dashboard — WorksheetHub">
<meta property="og:description" content="Your progress, what to continue, and what to practise next.">
<meta property="og:image" content="assets/img/og.png">
<meta name="twitter:card" content="summary_large_image">
<link rel="manifest" href="site.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@600;700&display=swap">
<link rel="stylesheet" href="assets/css/tokens.css">
<link rel="stylesheet" href="assets/css/base.css">
<link rel="stylesheet" href="assets/css/components.css">
<link rel="stylesheet" href="assets/css/pages.css">
</head>
<body>
<main id="main" class="wrap wrap-wide">
  <div class="app-layout">
    <div id="side-nav-host"></div>

    <div>
      <div class="welcome">
        <div>
          <h1 id="greeting">Welcome back!</h1>
          <p class="muted" style="margin:0" id="greeting-sub">Let's keep up the good work today.</p>
        </div>
        <div class="row" style="gap:8px">
          <a class="btn btn-ghost" href="join.html"><span class="ico" data-icon="key" data-size="17"></span> Join with a code</a>
          <a class="btn btn-primary" href="library.html">Find a worksheet</a>
        </div>
      </div>

      <div class="stat-grid" id="stats" style="margin-bottom:24px"></div>

      <section id="assigned" style="margin-bottom:24px" hidden>
        <div class="row-between" style="margin-bottom:16px">
          <h2 style="font-size:var(--step-2);margin:0">Set by your teacher</h2>
          <a class="btn btn-ghost btn-sm" href="join.html">My classes</a>
        </div>
        <div class="grid grid-2" id="assigned-list"></div>
      </section>

      <div class="grid grid-split-wide" style="gap:24px;margin-bottom:24px" id="middle-row">
        <section class="card continue-card" id="continue-card"></section>
        <section class="card">
          <div class="card-head">
            <h3 style="font-size:var(--step-1)">Recent worksheets</h3>
            <a class="small" href="progress.html">View all</a>
          </div>
          <div class="list list-divided" id="recent-list"></div>
        </section>
      </div>

      <section style="margin-bottom:24px">
        <div class="row-between" style="margin-bottom:16px">
          <h2 style="font-size:var(--step-2);margin:0">Recommended for you</h2>
          <a class="btn btn-ghost btn-sm" href="library.html">Browse everything</a>
        </div>
        <div class="grid grid-3" id="recommended"></div>
      </section>

      <div class="grid grid-2">
        <section class="card">
          <div class="card-head">
            <h3 style="font-size:var(--step-1)">Subject progress</h3>
            <a class="small" href="progress.html">Details</a>
          </div>
          <div id="subject-progress"></div>
        </section>
        <section class="card">
          <div class="card-head">
            <h3 style="font-size:var(--step-1)">Latest achievements</h3>
            <a class="small" href="achievements.html">All achievements</a>
          </div>
          <div class="list" id="achievement-list"></div>
        </section>
      </div>
    </div>
  </div>
</main>

<script type="module" src="assets/js/pages/dashboard.js"></script>
</body>
</html>

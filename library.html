<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Browse exercises — WorksheetHub</title>
<meta name="description" content="Search and filter thousands of exercises by grade, subject, topic, difficulty and question type.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%236366F1'/%3E%3Ctext x='16' y='23' font-family='Poppins,sans-serif' font-size='18' font-weight='700' fill='white' text-anchor='middle'%3EW%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@600;700&display=swap">
<link rel="stylesheet" href="assets/css/tokens.css">
<link rel="stylesheet" href="assets/css/base.css">
<link rel="stylesheet" href="assets/css/components.css">
<link rel="stylesheet" href="assets/css/pages.css">
</head>
<body>
<main id="main" class="wrap section-tight">
  <div class="section-head" style="max-width:none">
    <h1>Browse exercises</h1>
    <p>Filter down to exactly what you need, then practise online or print it.</p>
  </div>

  <form id="search-form" role="search" style="margin-bottom:24px">
    <div class="search-box">
      <span class="search-ico" aria-hidden="true">🔍</span>
      <label class="sr-only" for="q">Search exercises</label>
      <input class="input" id="q" name="q" type="search" autocomplete="off"
             placeholder="Search exercises — try “fractions grade 6” or “photosynthesis”">
    </div>
    <p class="hint" id="parse-note" hidden></p>
  </form>

  <div class="library-layout">
    <aside class="card filter-panel" aria-label="Filters">
      <div class="row-between" style="margin-bottom:4px">
        <strong style="font-family:var(--font-head)">Filters</strong>
        <button class="btn btn-ghost btn-sm" type="button" id="clear-filters">Clear</button>
      </div>
      <div id="filter-groups"></div>
    </aside>

    <section>
      <div class="results-head">
        <div>
          <strong id="result-count"></strong>
          <div class="active-filters" id="active-filters" style="margin-top:8px"></div>
        </div>
        <label class="row" style="gap:8px">
          <span class="small muted">Sort</span>
          <select class="select" id="sort" style="width:auto">
            <option value="recommended">Recommended</option>
            <option value="relevance">Best match</option>
            <option value="title">A–Z</option>
            <option value="easiest">Easiest first</option>
            <option value="shortest">Shortest first</option>
            <option value="longest">Longest first</option>
          </select>
        </label>
      </div>
      <div class="grid grid-3" id="results"></div>
    </section>
  </div>
</main>

<script type="module" src="assets/js/pages/library.js"></script>
</body>
</html>

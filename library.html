<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Browse worksheets — WorksheetHub</title>
<meta name="description" content="Search and filter over two million worksheets by grade, subject, topic, curriculum framework, difficulty, question type and length.">
<!-- Self-referencing, so every filter permutation in the query string
     collapses to one indexable URL. -->
<link rel="canonical" href="library.html">
<link rel="icon" type="image/svg+xml" href="assets/img/favicon.svg">
<link rel="alternate icon" sizes="64x64" href="assets/img/favicon-64.png">
<link rel="apple-touch-icon" href="assets/img/apple-touch-icon.png">
<meta name="theme-color" content="#4B3FD4">
<meta property="og:type" content="website">
<meta property="og:site_name" content="WorksheetHub">
<meta property="og:title" content="Browse worksheets — WorksheetHub">
<meta property="og:description" content="Search and filter over two million worksheets by grade, subject, topic, curriculum framework, difficulty, question type and length.">
<meta property="og:image" content="assets/img/og.png">
<meta name="twitter:card" content="summary_large_image">
<link rel="manifest" href="site.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@600;700&display=swap">
<link rel="stylesheet" href="assets/css/tokens.css">
<link rel="stylesheet" href="assets/css/base.css">
<link rel="stylesheet" href="assets/css/components.css">
<link rel="stylesheet" href="assets/css/pages.css">
</head>
<body>
<main id="main" class="wrap section-tight">
  <div class="section-head" style="max-width:none">
    <h1>Browse worksheets</h1>
    <p>Filter down to exactly what you need, then practise online or print it.</p>
  </div>

  <form id="search-form" role="search" style="margin-bottom:24px">
    <div class="search-box">
      <span class="search-ico"><span class="ico" data-icon="search" data-size="18"></span></span>
      <label class="sr-only" for="q">Search exercises</label>
      <input class="input" id="q" name="q" type="search" autocomplete="off"
             placeholder="Search worksheets — try “fractions grade 6” or “photosynthesis”">
    </div>
    <p class="hint" id="parse-note" hidden></p>
  </form>

  <div class="library-layout">
    <button class="btn btn-secondary filter-toggle" type="button" id="filter-toggle"
            aria-expanded="false" aria-controls="filter-panel">
      <span class="ico" data-icon="filter" data-size="17"></span>
      <span id="filter-toggle-label">Filters</span>
    </button>
    <aside class="card filter-panel" id="filter-panel" aria-label="Filters">
      <div class="filter-head">
        <strong>Filters</strong>
        <button class="btn btn-ghost btn-sm" type="button" id="clear-filters">Clear all</button>
      </div>
      <div id="filter-groups"></div>
    </aside>

    <section>
      <div class="results-head">
        <div>
          <strong id="result-count"></strong>
          <div class="active-filters" id="active-filters" style="margin-top:8px"></div>
        </div>
        <label class="row" style="gap:8px">
          <span class="small muted">Sort</span>
          <select class="select" id="sort" style="width:auto">
            <option value="recommended">Recommended</option>
            <option value="relevance">Best match</option>
            <option value="title">A–Z</option>
            <option value="easiest">Easiest first</option>
            <option value="shortest">Shortest first</option>
            <option value="longest">Longest first</option>
          </select>
        </label>
      </div>
      <div class="grid grid-3" id="results"></div>
      <div class="load-more" id="load-more" hidden></div>
    </section>
  </div>
</main>

<script type="module" src="assets/js/pages/library.js"></script>
</body>
</html>

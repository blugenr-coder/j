<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Print worksheet — WorksheetHub</title>
<meta name="description" content="A clean printable worksheet with room to work, plus a separate answer key.">
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns=%22http://www.w3.org/2000/svg%22%20viewBox=%220%200%2032%2032%22%3E%20%3Crect%20width=%2232%22%20height=%2232%22%20rx=%227%22%20fill=%22%236366F1%22/%3E%20%3Crect%20x=%229%22%20y=%225.5%22%20width=%2215%22%20height=%2219%22%20rx=%222.6%22%20fill=%22%23fff%22%20opacity=%22.32%22/%3E%20%3Crect%20x=%225.5%22%20y=%228%22%20width=%2215%22%20height=%2219%22%20rx=%222.6%22%20fill=%22%23fff%22/%3E%20%3Cpath%20d=%22M9%2013.5h5.5M9%2017.6h8M9%2021.7h4.5%22%20stroke=%22%236366F1%22%20stroke-width=%221.9%22%20stroke-linecap=%22round%22%20opacity=%22.5%22/%3E%20%3Cpath%20d=%22m14.2%2018.4%203%203%206.3-6.9%22%20fill=%22none%22%20stroke=%22%234F46E5%22%20stroke-width=%222.8%22%20stroke-linecap=%22round%22%20stroke-linejoin=%22round%22/%3E%20%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@600;700&display=swap">
<link rel="stylesheet" href="assets/css/tokens.css">
<link rel="stylesheet" href="assets/css/base.css">
<link rel="stylesheet" href="assets/css/components.css">
<link rel="stylesheet" href="assets/css/pages.css">
<link rel="stylesheet" href="assets/css/print.css">
</head>
<body>
<div class="paper-toolbar no-print">
  <div class="wrap wrap-wide row-between">
    <div class="row" style="gap:12px">
      <a class="icon-btn" id="back-link" href="library.html" aria-label="Back"><span class="ico" data-icon="arrow-left" data-size="18"></span></a>
      <div>
        <h1 id="doc-title" style="font-size:var(--step-1);margin:0"></h1>
        <div class="small muted" id="doc-meta"></div>
      </div>
    </div>

    <div class="row" style="gap:16px;flex-wrap:wrap">
      <label class="row small" style="gap:6px">
        <input type="checkbox" id="opt-key" checked> Include answer key
      </label>
      <label class="row small" style="gap:6px">
        <input type="checkbox" id="opt-work" checked> Space for working
      </label>
      <label class="row small" style="gap:6px">
        <input type="checkbox" id="opt-hints"> Print hints
      </label>
      <label class="row small" style="gap:6px">
        <span>Copies</span>
        <select class="select" id="opt-copies" style="width:auto;padding:4px 28px 4px 10px">
          <option>1</option><option>2</option><option>3</option>
        </select>
      </label>
      <a class="btn btn-ghost btn-sm" id="online-link" href="#"><span class="ico" data-icon="monitor" data-size="15"></span> Do it online</a>
      <button class="btn btn-primary btn-sm" id="print-btn" type="button"><span class="ico" data-icon="printer" data-size="15"></span> Print</button>
    </div>
  </div>
</div>

<main id="main" class="paper-stage">
  <div id="sheets"></div>
  <div id="not-found" class="wrap" hidden></div>
</main>

<script type="module" src="assets/js/pages/print.js"></script>
</body>
</html>

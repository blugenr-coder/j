<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My classes — WorksheetHub</title>
<meta name="description" content="Create a class, share the join code, and set work.">
<link rel="icon" type="image/svg+xml" href="../assets/img/favicon.svg">
<link rel="alternate icon" sizes="64x64" href="../assets/img/favicon-64.png">
<link rel="apple-touch-icon" href="../assets/img/apple-touch-icon.png">
<meta name="theme-color" content="#4B3FD4">
<meta property="og:type" content="website">
<meta property="og:site_name" content="WorksheetHub">
<meta property="og:title" content="My classes — WorksheetHub">
<meta property="og:description" content="Create a class, share the join code, and set work.">
<meta property="og:image" content="../assets/img/og.png">
<meta name="twitter:card" content="summary_large_image">
<link rel="manifest" href="../site.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@600;700&display=swap">
<link rel="stylesheet" href="../assets/css/tokens.css">
<link rel="stylesheet" href="../assets/css/base.css">
<link rel="stylesheet" href="../assets/css/components.css">
<link rel="stylesheet" href="../assets/css/pages.css">
</head>
<body data-base="..">
<main id="main" class="wrap wrap-wide">
  <div class="app-layout">
    <div id="side-nav-host"></div>
    <div>
      <div class="welcome">
        <div>
          <h1>My classes</h1>
          <p class="muted" style="margin:0">Each class has a join code. Share it and students appear on the roster.</p>
        </div>
        <button class="btn btn-primary" type="button" id="new-class-btn">New class</button>
      </div>

      <section class="card" id="new-class-panel" hidden style="margin-bottom:24px">
        <h3 style="font-size:var(--step-1)">Create a class</h3>
        <div class="grid grid-split">
          <label class="field">
            <span class="label">Class name</span>
            <input class="input" id="c-name" type="text" placeholder="e.g. Grade 8 Mathematics — Period 3">
          </label>
          <label class="field">
            <span class="label">Level</span>
            <select class="select" id="c-level"></select>
          </label>
          <label class="field">
            <span class="label">Main subject (optional)</span>
            <select class="select" id="c-subject"></select>
          </label>
        </div>
        <div class="row" style="gap:8px">
          <button class="btn btn-primary" type="button" id="create-class-btn">Create class</button>
          <button class="btn btn-ghost" type="button" id="cancel-class-btn">Cancel</button>
        </div>
      </section>

      <div id="class-list" class="grid grid-2"></div>
      <div id="class-empty"></div>
    </div>
  </div>
</main>

<script type="module" src="../assets/js/pages/teacher-classes.js"></script>
</body>
</html>

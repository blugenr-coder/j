<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Class analytics — WorksheetHub</title>
<meta name="description" content="Class averages, per-student results and the questions that caused most trouble.">
<!-- Behind a sign-in: a crawler gets an empty state, so there is nothing
     here to index. "follow" so the links out still carry weight. -->
<meta name="robots" content="noindex, follow">
<link rel="icon" type="image/svg+xml" href="../assets/img/favicon.svg">
<link rel="alternate icon" sizes="64x64" href="../assets/img/favicon-64.png">
<link rel="apple-touch-icon" href="../assets/img/apple-touch-icon.png">
<meta name="theme-color" content="#4B3FD4">
<meta property="og:type" content="website">
<meta property="og:site_name" content="WorksheetHub">
<meta property="og:title" content="Class analytics — WorksheetHub">
<meta property="og:description" content="Class averages, per-student results and the questions that caused most trouble.">
<meta property="og:image" content="../assets/img/og.png">
<meta name="twitter:card" content="summary_large_image">
<link rel="manifest" href="../site.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@600;700&display=swap">
<link rel="stylesheet" href="../assets/css/tokens.css">
<link rel="stylesheet" href="../assets/css/base.css">
<link rel="stylesheet" href="../assets/css/components.css">
<link rel="stylesheet" href="../assets/css/pages.css">
</head>
<body data-base="..">
<main id="main" class="wrap wrap-wide">
  <div class="app-layout">
    <div id="side-nav-host"></div>
    <div>
      <div class="welcome">
        <div>
          <h1>Class analytics</h1>
          <p class="muted" style="margin:0">Not just who scored what — which questions caused the trouble.</p>
        </div>
        <div class="row" style="gap:8px;flex-wrap:wrap">
          <label class="row" style="gap:6px">
            <span class="small muted">Class</span>
            <select class="select" id="pick-class" style="width:auto"></select>
          </label>
          <label class="row" style="gap:6px">
            <span class="small muted">Exercise</span>
            <select class="select" id="pick-exercise" style="width:auto"></select>
          </label>
        </div>
      </div>

      <div id="sample-note"></div>
      <div class="stat-grid" id="a-stats" style="margin-bottom:24px"></div>

      <div class="grid grid-split" style="gap:24px;margin-bottom:24px">
        <section class="card">
          <h3 style="font-size:var(--step-1)">Most difficult questions</h3>
          <p class="small muted">Lowest success rate first — these are worth reteaching.</p>
          <div class="list list-divided" id="hardest"></div>
        </section>
        <section class="card">
          <h3 style="font-size:var(--step-1)">Success rate by question</h3>
          <div id="question-bars"></div>
        </section>
      </div>

      <section class="card">
        <div class="card-head">
          <h3 style="font-size:var(--step-1)">Students</h3>
          <span class="small muted" id="student-count"></span>
        </div>
        <div class="table-scroll">
          <table class="table">
            <thead><tr><th>Student</th><th>Score</th><th>Correct</th><th style="width:40%">Progress</th></tr></thead>
            <tbody id="student-rows"></tbody>
          </table>
        </div>
      </section>
    </div>
  </div>
</main>

<script type="module" src="../assets/js/pages/teacher-analytics.js"></script>
</body>
</html>

<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Class analytics — WorksheetHub</title>
<meta name="description" content="Class averages, per-student results and the questions that caused most trouble.">
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns=%22http://www.w3.org/2000/svg%22%20viewBox=%220%200%2032%2032%22%3E%20%3Crect%20width=%2232%22%20height=%2232%22%20rx=%227%22%20fill=%22%236366F1%22/%3E%20%3Crect%20x=%229%22%20y=%225.5%22%20width=%2215%22%20height=%2219%22%20rx=%222.6%22%20fill=%22%23fff%22%20opacity=%22.32%22/%3E%20%3Crect%20x=%225.5%22%20y=%228%22%20width=%2215%22%20height=%2219%22%20rx=%222.6%22%20fill=%22%23fff%22/%3E%20%3Cpath%20d=%22M9%2013.5h5.5M9%2017.6h8M9%2021.7h4.5%22%20stroke=%22%236366F1%22%20stroke-width=%221.9%22%20stroke-linecap=%22round%22%20opacity=%22.5%22/%3E%20%3Cpath%20d=%22m14.2%2018.4%203%203%206.3-6.9%22%20fill=%22none%22%20stroke=%22%234F46E5%22%20stroke-width=%222.8%22%20stroke-linecap=%22round%22%20stroke-linejoin=%22round%22/%3E%20%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@600;700&display=swap">
<link rel="stylesheet" href="../assets/css/tokens.css">
<link rel="stylesheet" href="../assets/css/base.css">
<link rel="stylesheet" href="../assets/css/components.css">
<link rel="stylesheet" href="../assets/css/pages.css">
</head>
<body data-base="..">
<main id="main" class="wrap wrap-wide">
  <div class="app-layout">
    <div id="side-nav-host"></div>
    <div>
      <div class="welcome">
        <div>
          <h1>Class analytics</h1>
          <p class="muted" style="margin:0">Not just who scored what — which questions caused the trouble.</p>
        </div>
        <div class="row" style="gap:8px;flex-wrap:wrap">
          <label class="row" style="gap:6px">
            <span class="small muted">Class</span>
            <select class="select" id="pick-class" style="width:auto"></select>
          </label>
          <label class="row" style="gap:6px">
            <span class="small muted">Exercise</span>
            <select class="select" id="pick-exercise" style="width:auto"></select>
          </label>
        </div>
      </div>

      <div id="sample-note"></div>
      <div class="stat-grid" id="a-stats" style="margin-bottom:24px"></div>

      <div class="grid grid-split" style="gap:24px;margin-bottom:24px">
        <section class="card">
          <h3 style="font-size:var(--step-1)">Most difficult questions</h3>
          <p class="small muted">Lowest success rate first — these are worth reteaching.</p>
          <div class="list list-divided" id="hardest"></div>
        </section>
        <section class="card">
          <h3 style="font-size:var(--step-1)">Success rate by question</h3>
          <div id="question-bars"></div>
        </section>
      </div>

      <section class="card">
        <div class="card-head">
          <h3 style="font-size:var(--step-1)">Students</h3>
          <span class="small muted" id="student-count"></span>
        </div>
        <div class="table-scroll">
          <table class="table">
            <thead><tr><th>Student</th><th>Score</th><th>Correct</th><th style="width:40%">Progress</th></tr></thead>
            <tbody id="student-rows"></tbody>
          </table>
        </div>
      </section>
    </div>
  </div>
</main>

<script type="module" src="../assets/js/pages/teacher-analytics.js"></script>
</body>
</html>

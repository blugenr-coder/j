<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Create an assignment — WorksheetHub</title>
<meta name="description" content="Pick a grade, subject, topic and difficulty, then share a code with your class.">
<!-- Behind a sign-in: a crawler gets an empty state, so there is nothing
     here to index. "follow" so the links out still carry weight. -->
<meta name="robots" content="noindex, follow">
<link rel="icon" type="image/svg+xml" href="../assets/img/favicon.svg">
<link rel="alternate icon" sizes="64x64" href="../assets/img/favicon-64.png">
<link rel="apple-touch-icon" href="../assets/img/apple-touch-icon.png">
<meta name="theme-color" content="#4B3FD4">
<meta property="og:type" content="website">
<meta property="og:site_name" content="WorksheetHub">
<meta property="og:title" content="Create an assignment — WorksheetHub">
<meta property="og:description" content="Pick a grade, subject, topic and difficulty, then share a code with your class.">
<meta property="og:image" content="../assets/img/og.png">
<meta name="twitter:card" content="summary_large_image">
<link rel="manifest" href="../site.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@600;700&display=swap">
<link rel="stylesheet" href="../assets/css/tokens.css">
<link rel="stylesheet" href="../assets/css/base.css">
<link rel="stylesheet" href="../assets/css/components.css">
<link rel="stylesheet" href="../assets/css/pages.css">
</head>
<body data-base="..">
<main id="main" class="wrap wrap-wide">
  <div class="app-layout">
    <div id="side-nav-host"></div>
    <div style="max-width:900px">
      <h1>Create an assignment</h1>
      <p class="muted">Narrow the library down, choose the exercise, and share the code.</p>

      <div class="grid grid-split" style="gap:24px;align-items:start">
        <section class="card">
          <h3 style="font-size:var(--step-1)">1. Choose the work</h3>

          <label class="field">
            <span class="label">Class</span>
            <select class="select" id="f-class"></select>
          </label>

          <p class="small muted" id="f-class-empty" hidden>
            You have no classes yet. Create one and share its join code with your students.
          </p>
          <div class="row" style="gap:8px;flex-wrap:wrap;margin:-8px 0 16px">
            <button class="btn btn-ghost btn-sm" type="button" id="new-class-btn">Create class</button>
            <span class="small muted" id="f-class-code"></span>
          </div>

          <div class="card" id="quick-class" hidden style="margin-bottom:16px;background:var(--surface-2)">
            <label class="field">
              <span class="label">Class name</span>
              <input class="input" id="q-name" type="text" placeholder="e.g. Grade 8 Science — Period 3" autocomplete="off">
            </label>
            <label class="field">
              <span class="label">Level</span>
              <select class="select" id="q-level"></select>
            </label>
            <div class="row" style="gap:8px">
              <button class="btn btn-primary btn-sm" type="button" id="q-create">Create class</button>
              <button class="btn btn-ghost btn-sm" type="button" id="q-cancel">Cancel</button>
            </div>
          </div>

          <label class="field">
            <span class="label">Grade band</span>
            <select class="select" id="f-grade"></select>
          </label>

          <label class="field">
            <span class="label">Level</span>
            <select class="select" id="f-level"></select>
          </label>

          <label class="field">
            <span class="label">Subject</span>
            <select class="select" id="f-subject"></select>
          </label>

          <label class="field">
            <span class="label">Topic</span>
            <select class="select" id="f-topic"></select>
          </label>

          <label class="field">
            <span class="label">Difficulty</span>
            <select class="select" id="f-difficulty"></select>
          </label>

          <label class="field">
            <span class="label">Length</span>
            <select class="select" id="f-length">
              <option value="">Any length</option>
              <option value="short">Under 8 questions</option>
              <option value="medium">8–10 questions</option>
              <option value="long">11+ questions</option>
            </select>
          </label>
        </section>

        <section class="card">
          <h3 style="font-size:var(--step-1)">2. Pick the worksheets</h3>
          <p class="small muted" id="match-count"></p>
          <div class="list list-divided" id="match-list" style="max-height:340px;overflow-y:auto"></div>
          <div class="selected-strip" id="selected-strip" hidden></div>

          <hr class="divider">

          <h3 style="font-size:var(--step-1)">3. Details</h3>
          <label class="field">
            <span class="label">Title shown to students</span>
            <input class="input" id="f-title" type="text" placeholder="Uses the exercise name if left blank">
          </label>
          <label class="field">
            <span class="label">Due date</span>
            <input class="input" id="f-due" type="date">
          </label>
          <label class="field">
            <span class="label">Note (optional)</span>
            <textarea class="textarea" id="f-note" style="min-height:80px" placeholder="Anything the class should know before they start."></textarea>
          </label>

          <button class="btn btn-primary btn-block btn-lg" type="button" id="create-btn" disabled>Create assignment</button>
        </section>
      </div>

      <section class="card" id="result-card" style="margin-top:24px" hidden></section>
    </div>
  </div>
</main>

<script type="module" src="../assets/js/pages/teacher-create.js"></script>
</body>
</html>

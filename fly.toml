# Fly.io. `fly launch --no-deploy` then `fly deploy` reads this.
app = "worksheethub"
primary_region = "lhr"

[build]
  dockerfile = "Dockerfile"

[env]
  NODE_ENV = "production"
  PORT = "8080"
  HOST = "0.0.0.0"
  DATABASE = "/data/worksheethub.db"
  # Fly's proxy sits in front of every request.
  TRUST_PROXY = "1"

# SQLite is a file, so this app is one machine with one disk. Scaling it out
# means moving the database first — see DEPLOY.md.
[[mounts]]
  source = "worksheethub_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "suspend"
  auto_start_machines = true
  min_machines_running = 1

  [http_service.http_options.response.headers]
    # Fly sets this itself when force_https is on; the app sends its own too.

[[http_service.checks]]
  interval = "30s"
  timeout = "5s"
  grace_period = "10s"
  method = "GET"
  path = "/api/health"

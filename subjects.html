<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Subjects — WorksheetHub</title>
<meta name="description" content="Every subject, broken into topics you can practise one at a time.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%236366F1'/%3E%3Ctext x='16' y='23' font-family='Poppins,sans-serif' font-size='18' font-weight='700' fill='white' text-anchor='middle'%3EW%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@600;700&display=swap">
<link rel="stylesheet" href="assets/css/tokens.css">
<link rel="stylesheet" href="assets/css/base.css">
<link rel="stylesheet" href="assets/css/components.css">
<link rel="stylesheet" href="assets/css/pages.css">
</head>
<body>
<main id="main" class="wrap section">
  <div id="subject-index">
    <div class="section-head">
      <h1>What do you want to practise?</h1>
      <p>Pick a subject to see its topics. Every topic has worksheets written for several grade levels.</p>
    </div>
    <div class="grid grid-3" id="subject-cards"></div>
  </div>

  <div id="subject-detail" class="hidden">
    <div id="subject-crumb"></div>
    <div class="row" style="gap:16px;align-items:flex-start;margin-bottom:24px">
      <span class="tile-icon lg" id="subject-emoji" aria-hidden="true"></span>
      <div>
        <h1 id="subject-title" style="margin-bottom:4px"></h1>
        <p id="subject-blurb" style="margin:0"></p>
      </div>
    </div>

    <h2 style="font-size:var(--step-2)">Topics</h2>
    <div class="grid grid-4" id="topic-cards" style="margin-bottom:40px"></div>

    <div class="row-between" style="margin-bottom:16px">
      <h2 style="font-size:var(--step-2);margin:0">Worksheets in this subject</h2>
      <a class="btn btn-ghost btn-sm" id="subject-all-link" href="library.html">Open in library</a>
    </div>
    <div class="grid grid-3" id="subject-exercises"></div>
  </div>
</main>

<script type="module" src="assets/js/pages/subjects.js"></script>
</body>
</html>

<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Subjects — WorksheetHub</title>
<meta name="description" content="Every subject, broken into topics you can practise one at a time.">
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns=%22http://www.w3.org/2000/svg%22%20viewBox=%220%200%2032%2032%22%3E%20%3Crect%20width=%2232%22%20height=%2232%22%20rx=%227%22%20fill=%22%236366F1%22/%3E%20%3Crect%20x=%229%22%20y=%225.5%22%20width=%2215%22%20height=%2219%22%20rx=%222.6%22%20fill=%22%23fff%22%20opacity=%22.32%22/%3E%20%3Crect%20x=%225.5%22%20y=%228%22%20width=%2215%22%20height=%2219%22%20rx=%222.6%22%20fill=%22%23fff%22/%3E%20%3Cpath%20d=%22M9%2013.5h5.5M9%2017.6h8M9%2021.7h4.5%22%20stroke=%22%236366F1%22%20stroke-width=%221.9%22%20stroke-linecap=%22round%22%20opacity=%22.5%22/%3E%20%3Cpath%20d=%22m14.2%2018.4%203%203%206.3-6.9%22%20fill=%22none%22%20stroke=%22%234F46E5%22%20stroke-width=%222.8%22%20stroke-linecap=%22round%22%20stroke-linejoin=%22round%22/%3E%20%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@600;700&display=swap">
<link rel="stylesheet" href="assets/css/tokens.css">
<link rel="stylesheet" href="assets/css/base.css">
<link rel="stylesheet" href="assets/css/components.css">
<link rel="stylesheet" href="assets/css/pages.css">
</head>
<body>
<main id="main" class="wrap section">
  <div id="subject-index">
    <div class="section-head">
      <h1>What do you want to practise?</h1>
      <p>Pick a subject to see its topics. Every topic has worksheets written for several grade levels.</p>
    </div>
    <div class="subject-index" id="subject-cards"></div>
  </div>

  <div id="subject-detail" class="hidden">
    <div id="subject-crumb"></div>
    <div style="margin-bottom:28px;padding-bottom:20px;border-bottom:1px solid var(--border)">
      <h1 id="subject-title" style="margin-bottom:6px"></h1>
      <p id="subject-blurb" style="margin:0;max-width:70ch;font-size:var(--step-1)"></p>
    </div>

    <h2 style="font-size:var(--step-2)">Topics</h2>
    <div class="grid grid-4" id="topic-cards" style="margin-bottom:40px"></div>

    <div class="row-between" style="margin-bottom:16px">
      <h2 style="font-size:var(--step-2);margin:0">Worksheets in this subject</h2>
      <a class="btn btn-ghost btn-sm" id="subject-all-link" href="library.html">Open in library</a>
    </div>
    <div class="grid grid-3" id="subject-exercises"></div>
  </div>
</main>

<script type="module" src="assets/js/pages/subjects.js"></script>
</body>
</html>
